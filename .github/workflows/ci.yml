# ============================================================
# OpenWork CI/CD 流水线
# GitHub Actions 配置
# ============================================================

name: OpenWork CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: openwork
  POSTGRES_PASSWORD: openwork123
  POSTGRES_DB: openwork_db
  SECRET_KEY: test-secret-key-for-ci-only-32chars
  AES_SECRET_KEY: 00000000000000000000000000000000
  REDIS_URL: redis://localhost:6379/0

jobs:
  # ---- 后端测试 ----
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openwork -d openwork_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 配置环境变量
        working-directory: backend
        run: |
          cat > .env << EOF
          PROJECT_NAME=OpenWork
          VERSION=1.0.0
          DEBUG=false
          DATABASE_URL=postgresql+asyncpg://openwork:openwork123@localhost:5432/openwork_db
          REDIS_URL=redis://localhost:6379/0
          SECRET_KEY=${{ env.SECRET_KEY }}
          AES_SECRET_KEY=${{ env.AES_SECRET_KEY }}
          CORS_ORIGINS=["http://localhost:3000"]
          ADMIN_PHONE=13800000000
          ADMIN_PASSWORD=admin123456
          EOF

      - name: 执行数据库迁移
        working-directory: backend
        run: alembic upgrade head

      - name: 运行后端测试
        working-directory: backend
        run: pytest tests/ -v --tb=short

      - name: 代码检查 (flake8)
        working-directory: backend
        run: |
          pip install flake8
          flake8 app/ tests/ --max-line-length=120 --ignore=E501,W503 --count --statistics || true

  # ---- 前端测试 ----
  frontend-test:
    name: 前端测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: TypeScript 类型检查
        working-directory: frontend
        run: npx vue-tsc --noEmit || true

      - name: 构建前端
        working-directory: frontend
        run: npm run build

  # ---- Docker 构建验证 ----
  docker-build:
    name: Docker 构建验证
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -t openwork-backend:test ./backend

      - name: 构建前端镜像
        run: docker build -t openwork-frontend:test --target production ./frontend

      - name: 验证后端镜像
        run: |
          docker run --rm openwork-backend:test python -c "from app.main import app; print('OK')"

      - name: 验证前端镜像
        run: |
          docker run --rm openwork-frontend:test nginx -t
